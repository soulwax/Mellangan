# res/atlas.yaml -- what every cell of res/atlas.png is.
#
# Built from: src/Atlas.hpp (accessors + named indices), call sites under src/, the generator scripts in tools/
# (make_assets, make_*), and visual inspection. Every cell carries a `src` tag:
#   code  -- named in src/Atlas.hpp or used by raw index in src/ (authoritative)
#   gen   -- named by the tools/ generator that paints it (authoritative)
#   eye   -- a visual guess from the PNG, NOT referenced by code. A human should confirm or rename these.
# `ref` gives the C++ constant(s) that point at a cell; `xy` is the 16x16 sprite's top-left pixel.
# Grid: 18px pitch (16px sprite + 1px transparent gutter each side); 24 columns over 432px.

image: res/atlas.png
size: [432, 1488]
cell: {sprite: 16, pitch: 18, gutter: 1}
validator: tools/atlas_layout.py   # declares the bands below and checks gutters/allocation
rebuild: tools/make_assets.py      # Kenney base + FX, then every make_* step in PIPELINE order

bands:

