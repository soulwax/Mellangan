; Mellangan balance.
; Keys under [all] apply to every difficulty; the tier sections at the end override them.
; Tiers, in homage to DOOM: too_young, not_too_rough, hurt_me_plenty (the default),
; ultra_violence (the original balance, so its section is empty) and nightmare.
; To fine-tune without touching the game folder, put a balance.ini with the same format
; in the save folder (%APPDATA%\soulwax\Mellangan on Windows). It is read after this one,
; so its keys win. Changes apply at the start of the next run.
; Times are in seconds of the night (a night lasts 900 s).

[all]
; Wandering spawns: one batch every spawn_interval - t * spawn_ramp seconds (never below
; spawn_floor); each batch spawns 1 + t / batch_every foes, up to enemy_cap alive.
spawn_interval = 0.9
spawn_ramp = 0.005
spawn_floor = 0.06
batch_every = 70
enemy_cap = 550

; Hordes ring the player every horde_every seconds: horde_base + t / horde_ramp foes, at most horde_max.
horde_every = 60
horde_base = 24
horde_ramp = 12
horde_max = 64

; A Cyclops every boss_every seconds; each one after the first gains boss_hp_step times its health.
boss_every = 150
boss_hp_step = 0.75

; Foe health is enemy_hp * (1 + t / enemy_hp_ramp); damage is enemy_damage * (1 + t / enemy_damage_ramp).
; Larger ramps mean slower growth. enemy_speed scales how fast foes walk.
enemy_hp = 1
enemy_hp_ramp = 150
enemy_damage = 1
enemy_damage_ramp = 600
enemy_speed = 1

; Elites appear after elite_start seconds with chance elite_base + t / elite_ramp, and have elite_hp times the health.
elite_start = 60
elite_base = 0.03
elite_ramp = 6000
elite_hp = 4

; Chance a spawn is one of the region's own monsters, and chance a generic spawn is one of the two strongest kinds.
local_chance = 0.45
strong_chance = 0.55

; Player: base health before the class bonus, multiplier on damage taken, seconds untouchable after a hit.
player_hp = 100
damage_taken = 1
invuln = 0.6

; Experience: multiplier on every gem, and the level curve (xp_base + level * xp_base) * xp_growth ^ (level - 2).
xp = 1
xp_base = 6
xp_growth = 1.08

